<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>App Store · tailf</title>
<meta name="robots" content="noindex">
<meta http-equiv="refresh" content="0; url=https://apps.apple.com/kr/app/tailf/id6808048845">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="wrap">
  <header><a class="mark" href="/">tail<span>&nbsp;-f</span></a></header>
  <main class="go">
    <h1>App Store로 이동하고 있어요</h1>
    <p>자동으로 이동하지 않으면 아래 링크를 눌러 주세요.</p>
    <p><a href="https://apps.apple.com/kr/app/tailf/id6808048845">App Store에서 tailf 받기</a></p>
    <p class="go-back"><a href="/">← tailf 첫 화면으로</a></p>
  </main>
</div>
<script src="/app.js"></script>
<script>
/* 스크립트가 켜진 브라우저도 확인된 공개 스토어 주소로 이동합니다. */
(function () {
  if (!window.TAILF) return;
  window.TAILF.appStoreUrl(function (url) {
    if (url) window.location.replace(url);
  });
})();
</script>
</body>
</html>
