name: Deploy to Cloudflare Pages

# Every push deploys, and so does a clock every three hours: the company index,
# the role and tech hubs and the sitemaps are written from the live board right
# before each deploy (scripts/build-seo.mjs), so they are never more than three
# hours behind it. Posting and company pages are Functions and are always live.
on:
  push:
    branches:
      - main
  schedule:
    - cron: '23 */3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: tailf-web-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test
        run: node --test tests/*.mjs

      - name: Build search pages and sitemaps
        env:
          INDEXNOW_OUT: ${{ runner.temp }}/indexnow.json
        run: node scripts/build-seo.mjs

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=tailf-web --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      # The hourly web alert sender (workers/alert-sender, README 「앱 없이 받기」).
      # Its secrets live in Cloudflare, so a redeploy keeps them.
      - name: Deploy web alert sender
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/alert-sender
          command: deploy

      - name: Notify IndexNow
        env:
          CHANGED: ${{ runner.temp }}/indexnow.json
        run: |
          node -e '
            const fs = require("fs");
            const changed = JSON.parse(fs.readFileSync(process.env.CHANGED, "utf8"));
            const base = ["https://tailf.asyncsite.com/", "https://tailf.asyncsite.com/alerts/", "https://tailf.asyncsite.com/privacy/", "https://tailf.asyncsite.com/support/"];
            const urls = process.env.GITHUB_EVENT_NAME === "push" ? [...new Set([...base, ...changed])] : changed;
            fs.writeFileSync("/tmp/indexnow-body.json", JSON.stringify({
              host: "tailf.asyncsite.com",
              key: "e588df4aec01250f0622d3984d84a58c",
              keyLocation: "https://tailf.asyncsite.com/e588df4aec01250f0622d3984d84a58c.txt",
              urlList: urls.slice(0, 10000),
            }));
            console.log("indexnow urls", urls.length);
          '
          if [ "$(node -e 'console.log(require("/tmp/indexnow-body.json").urlList.length)')" -gt 0 ]; then
            curl --fail-with-body --silent --show-error \
              --request POST https://api.indexnow.org/indexnow \
              --header 'Content-Type: application/json; charset=utf-8' \
              --data @/tmp/indexnow-body.json
          fi
