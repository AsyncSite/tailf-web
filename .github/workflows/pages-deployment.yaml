name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  deployments: write

concurrency:
  group: tailf-web-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=tailf-web --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify IndexNow
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST https://api.indexnow.org/indexnow \
            --header 'Content-Type: application/json; charset=utf-8' \
            --data '{"host":"tailf.asyncsite.com","key":"e588df4aec01250f0622d3984d84a58c","keyLocation":"https://tailf.asyncsite.com/e588df4aec01250f0622d3984d84a58c.txt","urlList":["https://tailf.asyncsite.com/","https://tailf.asyncsite.com/privacy/","https://tailf.asyncsite.com/support/"]}'
